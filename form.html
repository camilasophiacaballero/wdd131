<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Product Review Form" />
    <meta name="author" content="Camila Sophia Caballero" />

    <title>Product Review Form</title>

    <link rel="stylesheet" href="styles/form.css" />

    <script src="scripts/form.js" defer></script>
    <script src="scripts/getdates.js" defer></script>
  </head>
  <body>
    <header>
      <h1>Product Review</h1>
    </header>

    <main>
      <form method="get" action="review.html">
        <label for="productName"> Product Name <span>*</span> </label>

        <select id="productName" name="productName" required>
          <option value="" disabled selected>Select a Product ...</option>
        </select>

        <fieldset>
          <legend>Overall Rating <span>*</span></legend>

          <label>
            ☆
            <input type="radio" id="rating1" name="rating" value="1" required />
          </label>

          <label>
            ☆☆
            <input type="radio" id="rating2" name="rating" value="2" />
          </label>

          <label>
            ☆☆☆
            <input type="radio" id="rating3" name="rating" value="3" />
          </label>

          <label>
            ☆☆☆☆
            <input type="radio" id="rating4" name="rating" value="4" />
          </label>

          <label>
            ☆☆☆☆☆
            <input type="radio" id="rating5" name="rating" value="5" />
          </label>
        </fieldset>

        <label for="installDate"> Date of Installation <span>*</span> </label>

        <input type="date" id="installDate" name="installDate" required />

        <fieldset>
          <legend>
            Useful Features
            <br />
            <em>(Check all that apply)</em>
          </legend>

          <label for="durability">
            <input
              type="checkbox"
              id="durability"
              name="features"
              value="Durability"
            />
            Durability
          </label>

          <label for="ease">
            <input
              type="checkbox"
              id="ease"
              name="features"
              value="Ease of Use"
            />
            Ease of Use
          </label>

          <label for="performance">
            <input
              type="checkbox"
              id="performance"
              name="features"
              value="Performance"
            />
            Performance
          </label>

          <label for="design">
            <input type="checkbox" id="design" name="features" value="Design" />
            Design
          </label>
        </fieldset>

        <label for="review">Written Review</label>

        <textarea id="review" name="review" rows="5"></textarea>

        <label for="username">User Name</label>

        <input type="text" id="username" name="username" />

        <input type="submit" value="Post Review" />
      </form>
    </main>

    <footer>
      <p>&copy;2026 Camila Sophia Caballero | Honduras</p>
      <p id="lastModified"></p>
    </footer>
  </body>
</html>
